kind = "web"
previewPath = "/"
title = "Accepted Admissions"
description = "A responsive admissions and tutoring platform with a polished public presence and a secure student, tutor, and administrator portal for Fall 2026 learning programs."
version = "1.0.0"
id = "artifacts/accepted-admissions"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21729

[services.development]
run = "pnpm --filter @workspace/accepted-admissions run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/accepted-admissions", "run", "build" ]
serve = "static"
publicDir = "artifacts/accepted-admissions/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21729"
BASE_PATH = "/"
