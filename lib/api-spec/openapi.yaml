        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /sessions/{sessionId}/lesson:
    get:
      operationId: getSessionLesson
      tags: [curriculum]
      summary: Tutor lesson dashboard grouped by homework weakness
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session lesson
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionLesson" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: requestSessionRetry
      tags: [curriculum]
      summary: Request a similar retry for a missed pre-work question
      description: >
        Uses an unused similar bank question first. If none remain and
        OPENAI_API_KEY is configured, drafts an analogous original item.
        Otherwise returns an honest blocked state. Does not reveal the answer.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionRetryInput" }
      responses:
        "201":
          description: Retry created or blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionRetry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503":
          description: Analog generation blocked without OPENAI_API_KEY
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionRetry" }
  /retries/{retryId}/outcome:
    post:
      operationId: recordRetryOutcome
      tags: [curriculum]
      summary: Record mastered vs still struggling for a retry
      parameters:
        - name: retryId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetryOutcomeInput" }
      responses:
        "200":
          description: Graded retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetryOutcome" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema: { type: string }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string }
    BlockId:
      name: blockId
      in: path
      required: true
      schema: { type: string }
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string }
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: string }
    ReviewItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string }
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: { type: string }
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema: { type: string }
    ProgramId:
      name: programId
      in: path
      required: true
      schema: { type: string }
    GuidanceRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string }
    GrantId:
      name: grantId
      in: path
      required: true
      schema: { type: string }
    TutorAssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BookingConflict:
      description: Booking cannot be completed because a credit, slot, or provider is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Operation conflicts with existing scheduling data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: Upstream payment provider unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        conflicts:
          type: array
          items: { type: string }
    FinancialStatus:
      type: string
      enum: [pending, sent, overdue, partially_paid, paid, failed, canceled, refunded, partially_refunded]
    SatProduct:
      type: object
      required: [id, slug, name, description, durationHours, totalPriceCents, effectiveHourlyRateCents, active]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        durationHours: { type: number }
        totalPriceCents: { type: number }
        effectiveHourlyRateCents: { type: number }
        active: { type: boolean }
    InvoiceRecord:
      type: object
      required: [id, status, provider, description, subtotalCents, discountCents, totalCents, createdAt]
      properties:
        id: { type: string }
        clientUserId: { type: ["string", "null"] }
        clientName: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/FinancialStatus" }
        provider: { type: string }
        providerInvoiceId: { type: ["string", "null"] }
        description: { type: string }
        issuerName: { type: string }
        issuerEmail: { type: string }
        issuerAddress: { type: string }
        clientEmail: { type: ["string", "null"] }
        lineItems:
          type: array
          items:
            type: object
            required: [description, quantity, unitPriceCents]
            properties:
              description: { type: string }
              quantity: { type: number }
              unitPriceCents: { type: number }
              productId: { type: ["string", "null"] }
        subtotalCents: { type: number }
        discountCents: { type: number }
        taxCents: { type: number }
        totalCents: { type: number }
        paymentInstructions: { type: string }
        hostedInvoiceUrl: { type: ["string", "null"] }
        receiptUrl: { type: ["string", "null"] }
        dueAt: { type: ["string", "null"], format: date-time }
        paidAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    PaymentRecord:
      type: object
      required: [id, amountCents, refundedAmountCents, status, method, createdAt]
      properties:
        id: { type: string }
        clientUserId: { type: ["string", "null"] }
        clientName: { type: ["string", "null"] }
        invoiceId: { type: ["string", "null"] }
        productId: { type: ["string", "null"] }
        productName: { type: ["string", "null"] }
        amountCents: { type: number }
        tutorShareCents: { type: number }
        platformShareCents: { type: number }
        refundedAmountCents: { type: number }
        status: { $ref: "#/components/schemas/FinancialStatus" }
        method: { type: string }
        failureReason: { type: ["string", "null"] }
        receiptUrl: { type: ["string", "null"] }
        verifiedAt: { type: ["string", "null"], format: date-time }
        paidAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    CreditLedgerEntry:
      type: object
      required: [id, entryType, hours, createdAt]
      properties:
        id: { type: string }
        clientUserId: { type: string }
        clientName: { type: ["string", "null"] }
        entryType: { type: string }
        hours: { type: number }
        note: { type: ["string", "null"] }
        productId: { type: ["string", "null"] }
        referenceType: { type: ["string", "null"] }
        referenceId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    FinancialSummary:
      type: object
      required: [readOnly, providerStatus, purchasedHours, usedHours, remainingHours, invoices, payments, credits]
      properties:
        readOnly: { type: boolean }
        providerStatus: { type: string }
        purchasedHours: { type: number }
        usedHours: { type: number }
        remainingHours: { type: number }
        invoices:
          type: array
          items: { $ref: "#/components/schemas/InvoiceRecord" }
        payments:
          type: array
          items: { $ref: "#/components/schemas/PaymentRecord" }
        credits:
          type: array
          items: { $ref: "#/components/schemas/CreditLedgerEntry" }
    CheckoutInput:
      type: object
      required: [productId]
      properties:
        productId: { type: string }
    CheckoutSession:
      type: object
      required: [paymentId, invoiceId, status, url]
      properties:
        paymentId: { type: string }
        invoiceId: { type: string }
        status: { type: string, enum: [pending] }
        url: { type: string }
    FinancialClient:
      type: object
      required: [id, displayName, email]
      properties:
        id: { type: string }
        displayName: { type: string }
        email: { type: string }
    AdminFinancials:
      type: object
      required: [clients, products, invoices, payments, credits, transfers]
      properties:
        clients:
          type: array
          items: { $ref: "#/components/schemas/FinancialClient" }
        products:
          type: array
          items: { $ref: "#/components/schemas/SatProduct" }
        invoices:
          type: array
          items: { $ref: "#/components/schemas/InvoiceRecord" }
        payments:
          type: array
          items: { $ref: "#/components/schemas/PaymentRecord" }
        credits:
          type: array
          items: { $ref: "#/components/schemas/CreditLedgerEntry" }
        transfers:
          type: array
          items: { $ref: "#/components/schemas/TutorTransferRecord" }
    TutorTransferRecord:
      type: object
      required: [id, paymentId, amountCents, reversedAmountCents, status, createdAt]
      properties:
        id: { type: string }
        paymentId: { type: string }
        clientName: { type: ["string", "null"] }
        tutorName: { type: ["string", "null"] }
        amountCents: { type: number }
        reversedAmountCents: { type: number }
        status: { type: string }
        failureReason: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    HostedInvoiceInput:
      type: object
      required: [clientUserId]
      properties:
        clientUserId: { type: string }
        productId: { type: string }
        description: { type: string, maxLength: 500 }
        issuerName: { type: string, maxLength: 200 }
        issuerEmail: { type: string, maxLength: 320 }
        issuerAddress: { type: string, maxLength: 1000 }
        clientName: { type: string, maxLength: 200 }
        clientEmail: { type: string, maxLength: 320 }
        lineItems:
          type: array
          maxItems: 25
          items: { $ref: "#/components/schemas/InvoiceLineItemInput" }
        discountCents: { type: number, minimum: 0 }
        taxCents: { type: number, minimum: 0 }
        paymentInstructions: { type: string, maxLength: 2000 }
        provider:
          type: string
          enum: [stripe_invoice, manual]
        dueAt: { type: string, format: date-time }
        daysUntilDue: { type: number, minimum: 1, maximum: 90, default: 7 }
    InvoiceLineItemInput:
      type: object
      required: [description, quantity, unitPriceCents]
      properties:
        description: { type: string, minLength: 1, maxLength: 500 }
        quantity: { type: number, minimum: 0.01, maximum: 100 }
        unitPriceCents: { type: number, minimum: 0, maximum: 100000000 }
        productId: { type: string }
    OfflinePaymentInput:
      type: object
      required: [clientUserId]
      properties:
        clientUserId: { type: string }
        productId: { type: string }
        invoiceId: { type: string }
        amountCents: { type: number, minimum: 1 }
        note: { type: string, maxLength: 2000 }
    CreditAdjustmentInput:
      type: object
      required: [clientUserId, hours, note]
      properties:
        clientUserId: { type: string }
        hours: { type: number, minimum: -100, maximum: 100 }
        note: { type: string, minLength: 3, maxLength: 2000 }
    InvoiceUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, sent, overdue, partially_paid, paid, failed, canceled]
        description: { type: string, maxLength: 500 }
        issuerName: { type: string, maxLength: 200 }
        issuerEmail: { type: string, maxLength: 320 }
        issuerAddress: { type: string, maxLength: 1000 }
        clientName: { type: string, maxLength: 200 }
        clientEmail: { type: string, maxLength: 320 }
        lineItems:
          type: array
          maxItems: 25
          items: { $ref: "#/components/schemas/InvoiceLineItemInput" }
        discountCents: { type: number, minimum: 0 }
        taxCents: { type: number, minimum: 0 }
        paymentInstructions: { type: string, maxLength: 2000 }
        dueAt: { type: string, format: date-time }
    ProductInput:
      type: object
      required: [slug, name, description, durationHours, totalPriceCents]
      properties:
        slug: { type: string, minLength: 2, maxLength: 100 }
        name: { type: string, minLength: 2, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        durationHours: { type: number, minimum: 0.25, maximum: 1000 }
        totalPriceCents: { type: number, minimum: 1, maximum: 100000000 }
        active: { type: boolean, default: true }
    ProductUpdate:
      type: object
      properties:
        slug: { type: string, minLength: 2, maxLength: 100 }
        name: { type: string, minLength: 2, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        durationHours: { type: number, minimum: 0.25, maximum: 1000 }
        totalPriceCents: { type: number, minimum: 1, maximum: 100000000 }
        active: { type: boolean }
    BookingTutor:
      type: object
      required: [id, name, title, subjects, calendarStatus, providerStatus]
      properties:
        id: { type: string }
        name: { type: string }
        title: { type: string }
        photoUrl: { type: ["string", "null"] }
        biography: { type: ["string", "null"] }
        subjects:
          type: array
          items: { type: string }
        calendarStatus: { type: string }
        providerStatus: { type: string, enum: [connected, disconnected] }
    BookingAvailability:
      type: object
      required: [tutor, providerStatus, slots]
      properties:
        tutor:
          type: object
          required: [id, name, title, timezone]
          properties:
            id: { type: string }
            name: { type: string }
            title: { type: string }
            timezone: { type: string }
        providerStatus: { type: string, enum: [connected, disconnected] }
        slots:
          type: array
          items: { type: string, format: date-time }
    BookingSession:
      type: object
      required: [id, courseId, tutorProfileId, tutorName, dateTime, timezone, subject, title, durationMinutes, bookingStatus, meetingUrl]
      properties:
        id: { type: string }
        courseId: { type: string }
        tutorProfileId: { type: ["string", "null"] }
        tutorName: { type: ["string", "null"] }
        dateTime: { type: string, format: date-time }
        timezone: { type: string }
        subject: { type: string }
        title: { type: string }
        durationMinutes: { type: number }
        bookingStatus: { type: string, enum: [confirmed, rescheduled, cancelled] }
        meetingUrl: { type: ["string", "null"] }
        calendarEventUrl: { type: ["string", "null"] }
        cancellationReason: { type: ["string", "null"] }
        creditRestored: { type: ["boolean", "null"] }
    BookingInput:
      type: object
      required: [tutorProfileId, startTime]
      properties:
        tutorProfileId: { type: string }
        startTime: { type: string, format: date-time }
        durationMinutes: { type: number, enum: [60], default: 60 }
    CancelBookingInput:
      type: object
      properties:
        reason: { type: string }
    RescheduleBookingInput:
      type: object
      required: [startTime]
      properties:
        startTime: { type: string, format: date-time }
    CalendarConnection:
      type: object
      required: [id, tutorProfileId, provider, status]
      properties:
        id: { type: string }
        tutorProfileId: { type: string }
        provider: { type: string }
        status: { type: string }
        connectedAt: { type: ["string", "null"], format: date-time }
    Role:
      type: string
      enum: [administrator, tutor, student, viewer]
    ProvisionableRoleCategory:
      type: string
      description: Roles that administrators may provision from the portal (never administrator or viewer).
      enum: [sat_tutor, english_tutor, tutor, student]
    AdminAccessGrant:
      type: object
      required:
        [
          id,
          email,
          clerkUserId,
          displayName,
          roleCategory,
          role,
          subject,
          active,
          notes,
          userId,
          createdAt,
          updatedAt,
          revokedAt,
        ]
      additionalProperties: false
      properties:
        id: { type: string }
        email: { type: string }
        clerkUserId: { type: ["string", "null"] }
        displayName: { type: string }
        roleCategory: { $ref: "#/components/schemas/ProvisionableRoleCategory" }
        role: { type: string, enum: [tutor, student] }
        subject: { type: string }
        active: { type: boolean }
        notes: { type: ["string", "null"] }
        userId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        revokedAt: { type: ["string", "null"], format: date-time }
        warning:
          type: ["string", "null"]
          description: Present when a pasted Clerk user ID was ignored or replaced because it is not a Production user for this email.
    AdminAccessGrantList:
      type: object
      required: [grants]
      additionalProperties: false
      properties:
        grants:
          type: array
          items: { $ref: "#/components/schemas/AdminAccessGrant" }
    AdminAccessGrantInput:
      type: object
      required: [email, displayName, roleCategory]
      additionalProperties: false
      properties:
        email: { type: string, minLength: 3 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        roleCategory: { $ref: "#/components/schemas/ProvisionableRoleCategory" }
        clerkUserId:
          type: ["string", "null"]
          description: >
            Optional Production Clerk user ID. If the ID is not in the Production
            Clerk instance (or belongs to a different email), it is ignored and
            replaced by an email lookup or create.
          minLength: 3
          maxLength: 128
        notes: { type: ["string", "null"], maxLength: 500 }
    AdminAccessGrantUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        roleCategory: { $ref: "#/components/schemas/ProvisionableRoleCategory" }
        clerkUserId: { type: ["string", "null"], minLength: 3, maxLength: 128 }
        notes: { type: ["string", "null"], maxLength: 500 }
        active: { type: boolean }
    CurrentUser:
      type: object
      required: [id, displayName, email, role]
      properties:
        id: { type: string }
        displayName: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        avatarUrl: { type: ["string", "null"] }
    AdminOverview:
      type: object
      required: [users, memberships, assignments, audit, loginActivity, accessConflicts, guidanceRequests, notifications]
      properties:
        users:
          type: array
          items:
            type: object
            required: [id, clerkUserId, email, displayName, role, createdAt]
            properties:
              id: { type: string }
              clerkUserId: { type: string }
              email: { type: string }
              displayName: { type: string }
              role: { $ref: "#/components/schemas/Role" }
              createdAt: { type: string, format: date-time }
        memberships:
          type: array
          items:
            type: object
            required: [id, courseId, courseTitle, userId, userName, membershipRole, subject]
            properties:
              id: { type: string }
              courseId: { type: string }
              courseTitle: { type: string }
              userId: { type: string }
              userName: { type: string }
              membershipRole: { $ref: "#/components/schemas/Role" }
              subject: { type: string }
        assignments:
          type: array
          items:
            type: object
            required: [id, courseId, courseTitle, tutorUserId, tutorName, studentUserId, studentName, subject]
            properties:
              id: { type: string }
              courseId: { type: string }
              courseTitle: { type: string }
              tutorUserId: { type: string }
              tutorName: { type: string }
              studentUserId: { type: string }
              studentName: { type: string }
              subject: { type: string }
        audit:
          type: array
          items:
            type: object
            required: [id, action, entityType, entityId, metadata, createdAt]
            properties:
              id: { type: string }
              action: { type: string }
              entityType: { type: string }
              entityId: { type: string }
              metadata: { type: object, additionalProperties: true }
              createdAt: { type: string, format: date-time }
        loginActivity:
          type: array
          items: { $ref: "#/components/schemas/AdminLoginActivity" }
        guidanceRequests:
          type: array
          description: Private guidance form submissions, visible only to administrators.
          items: { $ref: "#/components/schemas/AdminGuidanceRequest" }
        notifications:
          type: array
          description: Notifications addressed to the signed-in administrator.
          items: { $ref: "#/components/schemas/AdminNotification" }
        accessConflicts:
          type: array
          description: Conflicting role categories only; identity values are intentionally omitted.
          items:
            type: object
            required: [roleCategories]
            properties:
              roleCategories:
                type: array
                minItems: 2
                items:
                  type: string
                  enum: [administrator, sat_tutor, english_tutor, tutor, student, viewer]
    AdminLoginActivity:
      type: object
      required: [id, userId, userName, userEmail, role, signedInAt]
      properties:
        id: { type: string }
        userId: { type: string }
        userName: { type: string }
        userEmail: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        signedInAt: { type: string, format: date-time }
    AdminNotification:
      type: object
      required: [id, kind, title, message, status, readAt, dismissedAt, createdAt]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [guidance_request_assigned, booking_confirmed, booking_cancelled]
        guidanceRequestId: { type: ["string", "null"] }
        sessionId: { type: ["string", "null"] }
        title: { type: string }
        message: { type: string }
        status: { type: string, enum: [unread, read, dismissed] }
        readAt: { type: ["string", "null"], format: date-time }
        dismissedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    AdminNotificationUpdate:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [unread, read, dismissed] }
    AdminGuidanceRequest:
      type: object
      required: [id, guardianName, studentName, email, phone, gradeOrGraduationYear, currentSchool, serviceRequested, currentSatTotal, currentReadingWriting, currentMath, targetSatScore, plannedTestDate, goals, schedulingAvailability, referralSource, consentToContact, privacyAcknowledged, sourcePage, status, assignedStaffUserId, followUpNotes, conversionStatus, createdAt]
      properties:
        id: { type: string }
        guardianName: { type: string }
        studentName: { type: string }
        email: { type: string }
        phone: { type: string }
        gradeOrGraduationYear: { type: string }
        currentSchool: { type: string }
        serviceRequested: { type: string }
        currentSatTotal: { type: ["string", "null"] }
        currentReadingWriting: { type: ["string", "null"] }
        currentMath: { type: ["string", "null"] }
        targetSatScore: { type: ["string", "null"] }
        plannedTestDate: { type: ["string", "null"] }
        goals: { type: string }
