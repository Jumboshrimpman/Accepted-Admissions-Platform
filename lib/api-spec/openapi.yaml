openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Accepted Admissions learning platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authenticated profile operations
  - name: portal
    description: Student and tutor portal reads
  - name: curriculum
    description: Curriculum authoring and session content
  - name: assignments
    description: Homework assignment and attempt operations
  - name: review
    description: Tutor review and feedback operations
  - name: administration
    description: Administrator-only access and audit operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in application user
      responses:
        "200":
          description: Current user and role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [administration]
      summary: Get administrator-only access and audit information
      responses:
        "200":
          description: Provisioned users, memberships, tutor assignments, audit events, and login activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/notifications/{notificationId}:
    patch:
      operationId: updateAdminNotification
      tags: [administration]
      summary: Mark an administrator notification as unread, read, or dismissed
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminNotificationUpdate" }
      responses:
        "200":
          description: Updated administrator notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminNotification" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/guidance-requests/{requestId}:
    patch:
      operationId: updateAdminGuidanceRequest
      tags: [administration]
      summary: Triage an administrator-only guidance request
      parameters:
        - $ref: "#/components/parameters/GuidanceRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminGuidanceRequestUpdate" }
      responses:
        "200":
          description: Updated guidance request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminGuidanceRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/curriculum:
    get:
      operationId: getAdminCurriculum
      tags: [administration]
      summary: Get administrator curriculum and session operations data
      parameters:
        - name: courseId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Programs, sessions, assignments, materials, question status, and submissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCurriculum" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/access-grants:
    get:
      operationId: listAdminAccessGrants
      tags: [administration]
      summary: List portal access grants for tutors and students
      responses:
        "200":
          description: Access grants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccessGrantList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createAdminAccessGrant
      tags: [administration]
      summary: Provision a tutor or student for portal access
      description: >
        Creates or reactivates a database access grant for a tutor or student.
        Resolves the Production Clerk user by email (find or create, no invitation).
        A pasted clerkUserId is used only if it exists in Production for this email;
        otherwise it is replaced and a warning is returned.
        Administrator and viewer roles cannot be provisioned from this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAccessGrantInput" }
      responses:
        "201":
          description: Provisioned access grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccessGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/access-grants/{grantId}:
    patch:
      operationId: updateAdminAccessGrant
      tags: [administration]
      summary: Update or revoke a tutor or student access grant
      parameters:
        - $ref: "#/components/parameters/GrantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAccessGrantUpdate" }
      responses:
        "200":
          description: Updated access grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccessGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/tutor-assignments:
    post:
      operationId: createAdminTutorAssignment
      tags: [administration]
      summary: Assign a tutor to a student
      description: >
        Creates a tutor–student relationship for a program and subject.
        This is the People assign/unassign source of truth. Portal preview
        reflects the live link and cannot create or remove it.
        Does not send invitations or change deny-by-default portal access.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTutorAssignmentInput" }
      responses:
        "201":
          description: Created tutor–student assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTutorAssignment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/tutor-assignments/{assignmentId}:
    delete:
      operationId: deleteAdminTutorAssignment
      tags: [administration]
      summary: Remove a tutor–student assignment
      parameters:
        - $ref: "#/components/parameters/TutorAssignmentId"
      responses:
        "204":
          description: Assignment removed
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/clients/{clientId}/dashboard:
    get:
      operationId: getAdminClientDashboard
      tags: [administration]
      summary: Get an administrator-authorized read-only client dashboard preview
      parameters:
        - name: clientId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Client dashboard data marked as an administrator preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminClientDashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/programs/{programId}:
    patch:
      operationId: updateAdminProgram
      tags: [administration]
      summary: Edit, publish, or archive a program
      parameters:
        - name: programId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProgramUpdate" }
      responses:
        "200":
          description: Updated program
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProgram" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/assignments:
    post:
      operationId: createAdminAssignment
      tags: [administration]
      summary: Create an administrator-managed assignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAssignmentInput" }
      responses:
        "201":
          description: Created assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAssignment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/assignments/{assignmentId}:
    patch:
      operationId: updateAdminAssignment
      tags: [administration]
      summary: Edit, publish, or archive an assignment
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAssignmentUpdate" }
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAssignment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/assignments/{assignmentId}/clone-to-session:
    post:
      operationId: cloneAdminAssignmentToSession
      tags: [administration]
      summary: Clone a reusable quiz onto a session without moving the original
      description: >
        Creates a new session-specific assignment and copies question ordering
        and configuration. The source assignment, its session association, and
        all student attempts remain unchanged.
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string }
                allowDuplicate: { type: boolean }
      responses:
        "201":
          description: Cloned assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAssignment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/curriculum/library-assets:
    post:
      operationId: createAdminLibraryAsset
      tags: [administration]
      summary: Create a reusable curriculum library asset
      description: >
        Admin-authored building block (full SAT practice test, mini-section, or resource)
        that can later be attached to a specific session dashboard.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CurriculumLibraryAssetInput" }
      responses:
        "201":
          description: Created library asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurriculumLibraryAsset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/curriculum/library-assets/{assetId}:
    patch:
      operationId: updateAdminLibraryAsset
      tags: [administration]
      summary: Update a reusable curriculum library asset
      parameters:
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CurriculumLibraryAssetUpdate" }
      responses:
        "200":
          description: Updated library asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurriculumLibraryAsset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/sessions:
    post:
      operationId: createAdminSession
      tags: [administration]
      summary: Create an administrator-managed session with conflict detection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSessionInput" }
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/sessions/{sessionId}:
    patch:
      operationId: updateAdminSession
      tags: [administration]
      summary: Edit, publish, archive, or reassign a session with conflict detection
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSessionUpdate" }
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/sat-bank/import:
    post:
      operationId: importSatBank
      tags: [administration]
      summary: Import College Board JSON/JSONL extracts into the SAT/PSAT bank
      description: >
        Idempotent by source key (exam + test/form + module + question number).
        Does not invent official College Board wording. Official explanations
        stay separate from AI annotations.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SatBankImportInput" }
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SatBankImportResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/sat-bank/collections:
    get:
      operationId: listSatBankCollections
      tags: [administration]
      summary: List SAT/PSAT source collections in original-test order
      responses:
        "200":
          description: Source collections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SatBankCollection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/sat-bank/collections/{collectionId}:
    get:
      operationId: getSatBankCollection
      tags: [administration]
      summary: Open a source collection in original question order
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Collection with questions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SatBankCollectionDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/sat-bank/questions:
    get:
      operationId: listSatBankQuestions
      tags: [administration]
      summary: Browse canonical SAT/PSAT bank questions
      parameters:
        - name: examFamily
          in: query
          schema: { type: string, enum: [sat, psat] }
        - name: collectionId
          in: query
          schema: { type: string }
        - name: section
          in: query
          schema: { type: string, enum: [rw, math] }
        - name: skill
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Bank questions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SatBankQuestion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/sessions/{sessionId}/prework-from-bank:
    post:
      operationId: assignSatBankPrework
      tags: [administration]
      summary: Assign a ~60 minute SAT/PSAT pre-work set from the bank to a session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SatBankPreworkInput" }
      responses:
        "201":
          description: Assigned pre-work
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SatBankPreworkAssignment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /financials:
    get:
      operationId: getFinancials
      tags: [portal]
      summary: Get invoices, payments, and credits visible to the signed-in client
      responses:
        "200":
          description: Account-scoped financial records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /payments/checkout:
    post:
      operationId: createPaymentCheckout
      tags: [portal]
      summary: Create a Stripe-hosted Checkout session for an SAT product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutInput" }
      responses:
        "201":
          description: Hosted Checkout session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/financials:
    get:
      operationId: getAdminFinancials
      tags: [administration]
      summary: List all client invoices, payments, and credit adjustments
      responses:
        "200":
          description: Administrator financial records and form options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFinancials" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [administration]
      summary: List all SAT products for catalog administration
      responses:
        "200":
          description: Editable SAT product catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SatProduct" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createAdminProduct
      tags: [administration]
      summary: Create an SAT product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created SAT product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SatProduct" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/products/{productId}:
    patch:
      operationId: updateAdminProduct
      tags: [administration]
      summary: Edit or deactivate an SAT product
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdate" }
      responses:
        "200":
          description: Updated SAT product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SatProduct" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/invoices:
    post:
      operationId: createHostedInvoice
      tags: [administration]
      summary: Create and send a Stripe-hosted invoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostedInvoiceInput" }
      responses:
        "201":
          description: Hosted invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/invoices/{invoiceId}:
    patch:
      operationId: updateInvoice
      tags: [administration]
      summary: Update an administratively managed invoice state
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceUpdate" }
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/payments/offline:
    post:
      operationId: createOfflinePayment
      tags: [administration]
      summary: Record a verified offline SAT payment and fulfill its credits
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfflinePaymentInput" }
      responses:
        "201":
          description: Paid offline payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/credit-adjustments:
    post:
      operationId: createCreditAdjustment
      tags: [administration]
      summary: Add an audited client credit or debit adjustment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreditAdjustmentInput" }
      responses:
        "201":
          description: Credit ledger adjustment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditLedgerEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /dashboard:
    get:
      operationId: getDashboard
      tags: [portal]
      summary: Get the signed-in user's dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
