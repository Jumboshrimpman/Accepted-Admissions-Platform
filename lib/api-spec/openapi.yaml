        skill: { type: string, minLength: 1, maxLength: 200 }
        difficulty: { type: string, enum: [foundational, medium, hard] }
        stimulus: { type: ["string", "null"], maxLength: 5000 }
        prompt: { type: string, minLength: 1, maxLength: 5000 }
        choices:
          type: array
          items:
